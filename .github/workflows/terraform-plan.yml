name: terraform-plan

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "modules/**"
      - "envs/**"
      - ".github/workflows/terraform-*.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.72.6/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terragrunt hcl fmt
        run: terragrunt hclfmt --terragrunt-check

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: TFLint
        run: tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform

  plan:
    name: plan ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: uat
            role_secret: AWS_ROLE_TO_ASSUME_UAT
          - env: prod
            role_secret: AWS_ROLE_TO_ASSUME_PROD
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Install Terragrunt
        run: |
          curl -L -o terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v0.72.6/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets[matrix.role_secret] }}

      - name: Terragrunt plan
        working-directory: envs/${{ matrix.env }}/ap-southeast-1
        run: terragrunt run-all plan --terragrunt-non-interactive
